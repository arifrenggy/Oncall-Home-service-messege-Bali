services:
  # MariaDB database with the schema auto-imported on first run
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: oncall_massage_bali
      MYSQL_USER: oncall
      MYSQL_PASSWORD: oncallpass
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The PHP/Apache app (uses the repo's Dockerfile)
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      MYSQLHOST: db
      MYSQLPORT: "3306"
      MYSQLDATABASE: oncall_massage_bali
      MYSQLUSER: oncall
      MYSQLPASSWORD: oncallpass
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
